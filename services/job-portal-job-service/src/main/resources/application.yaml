spring:
  application:
    name: job-portal-job-service

  datasource:
    url: jdbc:postgresql://localhost:5432/job-portal-job
    username: rajnishkushwaha
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 5003


eureka:
  client:
    fetch-registry: true
    register-with-eureka: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-addrress: true