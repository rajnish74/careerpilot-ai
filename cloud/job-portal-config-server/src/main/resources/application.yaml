
server:
  port: 8888

spring:
  application:
    name: job-portal-config-server

  cloud:
    config:
      server:
        git:
          uri: "https://github.com/rajnish74/careerpilot-ai-config"
          clone-on-start: true
          default-label: master
          timeout: 30

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
